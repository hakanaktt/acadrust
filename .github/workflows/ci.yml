name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets and features
        run: cargo check --all-targets --all-features
      - name: Test default features
        run: cargo test
      - name: Test sequential mode
        run: cargo test --no-default-features
      - name: Check sequential mode with optional features
        run: cargo check --all-targets --no-default-features --features serde,import
      - name: Test all features
        run: cargo test --all-features

  wasm:
    name: Check WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Check default features
        run: cargo check --lib --target wasm32-unknown-unknown
      - name: Check sequential mode
        run: cargo check --lib --no-default-features --target wasm32-unknown-unknown
      - name: Check all features
        run: cargo check --lib --all-features --target wasm32-unknown-unknown

  freebsd:
    name: Check FreeBSD (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # c_char is u8 on aarch64 and i8 on x86_64.
        target: [aarch64-unknown-freebsd, x86_64-unknown-freebsd]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Check all targets and features
        run: cargo check --all-targets --all-features --target ${{ matrix.target }}
