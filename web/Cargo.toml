[package]
name = "acadrust-wasm-viewer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
acadrust = { path = "..", default-features = false, features = ["render"] }
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "=0.4.71"
wgpu = "=30.0.0"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Performance",
    "Window",
] }
