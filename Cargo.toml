[package]
name = "acadrust"
version = "0.6.8"
edition = "2021"
authors = ["Hakan AK"]
description = "A pure Rust library for reading and writing CAD files in DXF format (ASCII and Binary) and DWG format (Binary)."
license = "MPL-2.0"
repository = "https://github.com/hakanaktt/acadrust"
homepage = "https://github.com/hakanaktt/acadrust"
documentation = "https://docs.rs/acadrust"
readme = "README.md"
keywords = ["cad", "dxf", "dwg", "drawing", "vector-graphics"]
categories = ["parser-implementations", "encoding"]

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
serde = ["dep:serde", "bitflags/serde", "indexmap/serde"]
import = ["dep:quick-xml", "dep:serde_json"]

[dependencies]
# Error handling
thiserror = "2"
anyhow = "1.0"

# Binary parsing
nom = "7.1"
memchr = "2"
byteorder = "1.5"

# Compression
flate2 = "1.0"

# Collections
indexmap = "2.0"
foldhash = "0.2"

# Encoding
encoding_rs = "0.8"
oem_cp = "2.1"

# Serialization (optional)
serde = { version = "1", features = ["derive", "rc"], optional = true }

# XML parsing (optional, for COLLADA import)
quick-xml = { version = "0.36", optional = true }

# JSON parsing (optional, for glTF import)
serde_json = { version = "1", optional = true, features = ["preserve_order"] }

# Utilities
bitflags = "2.4"
once_cell = "1.19"
web-time = "1"

# Fast number formatting
itoa = "1"
ryu = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2 = "0.9"
rayon = { version = "1", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"
